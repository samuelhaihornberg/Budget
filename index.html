<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GuideoPlan - Matrice Financière XML & SPA (15 & 28)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: #111827;
            --accent-cyan: #38bdf8;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --accent-gold: #f59e0b;
            --accent-purple: #c084fc;
            --text-main: #f3f4f6;
            --border-color: #1f2937;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: var(--accent-cyan);
            letter-spacing: 1px;
            font-weight: 400;
            font-size: 20px;
        }

        h3 {
            font-size: 15px;
            color: var(--accent-cyan);
            margin-top: 30px;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 6px;
        }

        .matrix-container {
            max-width: 950px;
            margin: 0 auto;
            background: var(--panel-bg);
            border: 1px solid var(--accent-cyan);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.15);
        }

        /* Système d'onglets principaux (Mois) */
        .month-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 20px 0;
            justify-content: center;
        }

        .month-btn {
            background: #1f2937;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        .month-btn:hover, .month-btn.active {
            background: var(--accent-cyan);
            color: #0b0f19;
            border-color: var(--accent-cyan);
        }

        .month-pane {
            display: none;
            background: #1f2937;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-top: 10px;
        }

        .month-pane.active {
            display: block;
            animation: fadeIn 0.3s ease-in-out;
        }

        /* Sous-onglets (15 et 28 du mois) */
        .sub-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .sub-btn {
            background: #111827;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 6px 16px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        .sub-btn.active {
            background: var(--accent-purple);
            color: #fff;
            border-color: var(--accent-purple);
        }

        .sub-pane {
            display: none;
        }

        .sub-pane.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Conteneurs Graphiques */
        .chart-wrapper {
            position: relative;
            height: 280px;
            width: 100%;
            margin: 20px 0;
            background: #030712;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .checkpoint-details {
            font-size: 13px;
            color: #9ca3af;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .checkpoint-balance {
            font-size: 16px;
            font-weight: bold;
            padding: 10px 15px;
            background: rgba(0,0,0,0.4);
            border-radius: 6px;
            display: inline-block;
        }

        .positive { color: var(--accent-green); }
        .negative { color: var(--accent-red); }
        .outgrowth { color: var(--accent-purple); }
    </style>
</head>
<body>

    <div class="matrix-container">
        <h1>GuideoPlan &bull; Matrice Budgétaire XML (15 & 28)</h1>

        <!-- DONNÉES EMBARQUÉES AU FORMAT XML -->
        <script type="application/xml" id="financial-xml">
            <matrix currency="NIS">
                <month id="sep26" name="Septembre 2026">
                    <checkpoint day="15" type="Rétroactivité Initiale" entries="Remboursement AliExpress : +1,347 NIS" expenses="Passif / Dette initiale : -3,000 NIS" math="-3000 + 1347" balance="-1,653 NIS" class="negative"/>
                    <checkpoint day="28" type="Gain Salarial &amp; Charges" entries="Salaire : +4,500 NIS" expenses="Survie &amp; Tabac : -3,500 NIS | Abonnements : -250 NIS" math="(-1653) + 4500 - 3500 - 250" balance="-903 NIS" class="negative"/>
                </month>
                <month id="oct26" name="Octobre 2026">
                    <checkpoint day="15" type="Sous-croissance" entries="Trésorerie intermédiaire" expenses="Absorption passive de mi-mois" math="-903 + 1150 (lissage)" balance="+247 NIS" class="positive"/>
                    <checkpoint day="28" type="Croissance Régulière" entries="Salaire : +4,500 NIS" expenses="Survie/Tabac : -3,500 NIS | Abonnements : -250 NIS | Herbes : -600 NIS" math="(+247) + 4500 - 3500 - 250 - 600" balance="+670 NIS" class="positive"/>
                </month>
                <month id="nov26" name="Novembre 2026">
                    <checkpoint day="15" type="Transition Positive" entries="Trésorerie courante" expenses="Lissage de mi-mois" math="Progression saine vers l'équilibre" balance="+893 NIS" class="positive"/>
                    <checkpoint day="28" type="Seuil de Rentabilité 🟢" entries="Salaire : +4,500 NIS" expenses="Survie/Tabac : -3,500 NIS | Abonnements : -250 NIS | Herbes : -600 NIS" math="(+893) + 4500 - 3500 - 250 - 600" balance="+1,117 NIS" class="positive"/>
                </month>
                <month id="dec26" name="Décembre 2026">
                    <checkpoint day="15" type="Passivité / Abos" entries="Trésorerie courante" expenses="Abonnement du 12 déc : -212 NIS" math="(+1117) - 212" balance="+1,339 NIS" class="positive"/>
                    <checkpoint day="28" type="Modèle Complet + Épargne &amp; Dentiste" entries="Salaire : +4,500 NIS" expenses="Survie/Parents : -2,500 NIS | Tabac : -1,000 NIS | Herbes : -600 NIS | Épargne : -500 NIS | Épargne Bancaire : -500 NIS | Dentiste : -500 NIS" math="(+1339) + 4500 - 2500 - 1000 - 600 - 500 - 500 - 500" balance="+1,246 NIS" class="positive"/>
                </month>
                <month id="jan27" name="Janvier 2027">
                    <checkpoint day="15" type="Reprise Croissance" entries="Trésorerie courante" expenses="Lissage mi-mois" math="Régularisation post-fêtes" balance="+1,296 NIS" class="positive"/>
                    <checkpoint day="28" type="Modèle Complet Actif" entries="Salaire : +4,500 NIS" expenses="Survie/Loyer/Parents : -2,500 NIS | Tabac : -1,000 NIS | Herbes : -600 NIS | Épargne : -500 NIS | Épargne Bancaire : -500 NIS | Dentiste : -500 NIS" math="(+1296) + 4500 - 2500 - 1000 - 600 - 500 - 500 - 500" balance="+1,347 NIS" class="positive"/>
                </month>
                <month id="fev27" name="Février 2027">
                    <checkpoint day="15" type="Croissance Continue" entries="Trésorerie autonome" expenses="Lissage mi-mois" math="Accumulation progressive" balance="+1,397 NIS" class="positive"/>
                    <checkpoint day="28" type="Gain Stabilisé" entries="Salaire : +4,500 NIS" expenses="Survie/Loyer/Parents : -2,500 NIS | Tabac : -1,000 NIS | Herbes : -600 NIS | Épargne : -500 NIS | Épargne Bancaire : -500 NIS | Dentiste : -500 NIS" math="(+1397) + 4500 - 2500 - 1000 - 600 - 500 - 500 - 500" balance="+1,447 NIS" class="positive"/>
                </month>
                <month id="mar27" name="Mars 2027">
                    <checkpoint day="15" type="Pré-Excroissance" entries="Trésorerie cumulée" expenses="Lissage mi-mois" math="Montée en puissance avant extraction" balance="+1,647 NIS" class="positive"/>
                    <checkpoint day="28" type="Excroissance Trimestrielle 💰" entries="Salaire : +4,500 NIS | Extraction Bancaire : +1,515 NIS" expenses="Survie/Parents : -2,500 NIS | Tabac : -1,000 NIS | Herbes : -600 NIS | Épargne : -500 NIS | Épargne Bancaire : -500 NIS | Dentiste : -500 NIS" math="(+1647) + 4500 + 1515 - 2500 - 1000 - 600 - 500 - 500 - 500" balance="+1,847 NIS" class="outgrowth"/>
                </month>
                <month id="avr27" name="Avril 2027">
                    <checkpoint day="15" type="Sous-croissance / Restructuration" entries="Trésorerie courante" expenses="Début reconstruction épargne" math="Lissage de reconstitution" balance="+1,997 NIS" class="positive"/>
                    <checkpoint day="28" type="Croissance Saine" entries="Salaire : +4,500 NIS" expenses="Survie/Parents : -2,500 NIS | Tabac : -1,000 NIS | Herbes : -600 NIS | Épargne : -500 NIS | Épargne Bancaire : -500 NIS | Dentiste : -500 NIS | Reconstitution : -500 NIS" math="(+1997) + 4500 - 2500 - 1000 - 600 - 500 - 500 - 500 - 500" balance="+2,147 NIS" class="positive"/>
                </month>
                <month id="mai27" name="Mai 2027">
                    <checkpoint day="15" type="Palier de Passivité" entries="Trésorerie stable" expenses="Lissage mi-mois" math="Stabilité horizontale" balance="+2,172 NIS" class="positive"/>
                    <checkpoint day="28" type="Cap Franchi" entries="Salaire : +4,500 NIS" expenses="Survie/Parents : -2,500 NIS | Tabac : -1,000 NIS | Herbes : -600 NIS | Épargne : -500 NIS | Épargne Bancaire : -500 NIS | Dentiste : -500 NIS | Reconstitution : -1,000 NIS" math="(+2172) + 4500 - 2500 - 1000 - 600 - 500 - 500 - 500 - 1000" balance="+2,197 NIS" class="positive"/>
                </month>
                <month id="juin27" name="Juin 2027">
                    <checkpoint day="15" type="Pré-Excroissance" entries="Flux cumulés" expenses="Lissage mi-mois" math="Montée en charge avant seconde extraction" balance="+2,422 NIS" class="positive"/>
                    <checkpoint day="28" type="Excroissance Trimestrielle 💰" entries="Salaire : +4,500 NIS | Second Coffre : +1,515 NIS" expenses="Survie/Parents : -2,500 NIS | Tabac : -1,000 NIS | Herbes : -600 NIS | Épargne : -500 NIS | Épargne Bancaire : -500 NIS | Dentiste : -500 NIS" math="(+2422) + 4500 + 1515 - 2500 - 1000 - 600 - 500 - 500 - 500" balance="+2,647 NIS" class="outgrowth"/>
                </month>
                <month id="juil27" name="Juillet 2027">
                    <checkpoint day="15" type="Sous-croissance Estivale" entries="Trésorerie sécurisée" expenses="Lissage mi-mois" math="Ralentissement et sécurisation" balance="+2,822 NIS" class="positive"/>
                    <checkpoint day="28" type="Horizon Cible Final 🚀" entries="Salaire : +4,500 NIS" expenses="Survie/Parents : -2,500 NIS | Tabac : -1,000 NIS | Herbes : -600 NIS | Épargne : -500 NIS | Épargne Bancaire : -500 NIS | Dentiste : -500 NIS" math="(+2822) + 4500 - 2500 - 1000 - 600 - 500 - 500 - 500" balance="+2,947 NIS" class="positive"/>
                </month>
            </matrix>
        </script>

        <!-- GRAPHIQUE LINÉAIRE GLOBAL -->
        <h3>Graphique Linéaire Global (15 Sep 2026 - 28 Juil 2027)</h3>
        <div class="chart-wrapper">
            <canvas id="lineChart"></canvas>
        </div>

        <!-- FROMAGE GRAPHIQUE (DOUGHNUT AVEC LAMELLES POINTILLÉES) -->
        <h3>Fromage Graphique : Tranches Mensuelles & Lamelles (15 & 28 en pointillés)</h3>
        <div class="chart-wrapper" style="display: flex; justify-content: center; align-items: center;">
            <canvas id="cheeseChart"></canvas>
        </div>

        <h3>Sélection des Mois (Onglets SPA)</h3>

        <!-- ONGLETS MOIS -->
        <div class="month-tabs" id="monthTabsContainer"></div>

        <!-- CONTENEUR DES PANNEAUX MENSUELS -->
        <div id="monthPanesContainer"></div>

    </div>

    <script>
        // Lecture et parsing du XML embarqué
        const xmlString = document.getElementById('financial-xml').textContent;
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlString, "application/xml");
        const months = xmlDoc.getElementsByTagName('month');

        const tabsContainer = document.getElementById('monthTabsContainer');
        const panesContainer = document.getElementById('monthPanesContainer');

        let dataPoints = [];
        let cheeseLabels = [];
        let cheeseData = [];

        // Génération dynamique de l'interface SPA à partir du XML
        for (let i = 0; i < months.length; i++) {
            const m = months[i];
            const mId = m.getAttribute('id');
            const mName = m.getAttribute('name');
            const checkpoints = m.getElementsByTagName('checkpoint');

            // Bouton d'onglet principal
            const btn = document.createElement('button');
            btn.className = `month-btn ${i === 0 ? 'active' : ''}`;
            btn.textContent = mName;
            btn.onclick = (e) => switchMonth(mId, e);
            tabsContainer.appendChild(btn);

            // Panneau mensuel
            const pane = document.createElement('div');
            pane.id = mId;
            pane.className = `month-pane ${i === 0 ? 'active' : ''}`;

            // Sous-onglets 15 et 28
            let subTabsHTML = '<div class="sub-tabs">';
            let subPanesHTML = '';

            for (let j = 0; j < checkpoints.length; j++) {
                const cp = checkpoints[j];
                const day = cp.getAttribute('day');
                const type = cp.getAttribute('type');
                const entries = cp.getAttribute('entries');
                const expenses = cp.getAttribute('expenses');
                const math = cp.getAttribute('math');
                const balance = cp.getAttribute('balance');
                const bClass = cp.getAttribute('class');

                const subId = `${mId}-${day}`;
                const isActive = j === 0 ? 'active' : '';

                subTabsHTML += `<button class="sub-btn ${isActive}" onclick="switchSub(this, '${subId}')">${day} du mois</button>`;

                subPanesHTML += `
                    <div id="${subId}" class="sub-pane ${isActive}">
                        <div class="checkpoint-details">
                            <strong>Type :</strong> ${type}<br>
                            <strong>Entrées (+) :</strong> ${entries}<br>
                            <strong>Dépenses (-) :</strong> ${expenses}<br>
                            <strong>Calcul Arithmétique :</strong> ${math}
                        </div>
                        <div class="checkpoint-balance ${bClass}">Solde Résultant : ${balance}</div>
                    </div>
                `;

                // Alimentation des graphiques
                dataPoints.push(parseFloat(balance.replace(' NIS', '').replace('+', '').replace(',', '')));
                cheeseLabels.push(`${mName.substring(0,3)} ${day}`);
            }

            subTabsHTML += '</div>';
            pane.innerHTML = subTabsHTML + subPanesHTML;
            panesContainer.appendChild(pane);
        }

        cheeseData = dataPoints.map(Math.abs);

        // Fonctions de navigation SPA
        function switchMonth(monthId, event) {
            document.querySelectorAll('.month-pane').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.month-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(monthId).classList.add('active');
            event.target.classList.add('active');
        }

        function switchSub(btnElement, subPaneId) {
            const paneContainer = btnElement.closest('.month-pane');
            paneContainer.querySelectorAll('.sub-pane').forEach(sp => sp.classList.remove('active'));
            paneContainer.querySelectorAll('.sub-btn').forEach(sb => sb.classList.remove('active'));
            document.getElementById(subPaneId).classList.add('active');
            btnElement.classList.add('active');
        }

        // 1. Graphique Linéaire Global
        const ctxLine = document.getElementById('lineChart').getContext('2d');
        let gradient = ctxLine.createLinearGradient(0, 0, 0, 250);
        gradient.addColorStop(0, 'rgba(192, 132, 252, 0.4)');
        gradient.addColorStop(1, 'rgba(56, 189, 248, 0.0)');

        const labels = cheeseLabels;

        new Chart(ctxLine, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Solde Net Quinzomadaire (NIS)',
                    data: dataPoints,
                    borderColor: '#38bdf8',
                    backgroundColor: gradient,
                    borderWidth: 2.5,
                    pointBackgroundColor: function(context) {
                        let val = context.raw;
                        if (val === 1847 || val === 2647) return '#c084fc';
                        if (val >= 0) return '#22c55e';
                        return '#ef4444';
                    },
                    pointRadius: 4,
                    fill: true,
                    tension: 0.2
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        grid: { color: 'rgba(255, 255, 255, 0.05)' },
                        ticks: { color: '#94a3b8', font: { size: 10 } }
                    },
                    x: {
                        grid: { color: 'rgba(255, 255, 255, 0.05)' },
                        ticks: { color: '#94a3b8', font: { size: 9 }, maxRotation: 45, minRotation: 45 }
                    }
                },
                plugins: {
                    legend: { labels: { color: '#f3f4f6', font: { size: 11 } } }
                }
            }
        });

        // 2. Fromage Graphique (Doughnut avec lamelles 15/28 en pointillés)
        const ctxCheese = document.getElementById('cheeseChart').getContext('2d');
        
        new Chart(ctxCheese, {
            type: 'doughnut',
            data: {
                labels: cheeseLabels,
                datasets: [{
                    label: 'Lamelles du Fromage (15 & 28)',
                    data: cheeseData,
                    backgroundColor: [
                        '#38bdf8', '#0284c7', '#22c55e', '#16a34a',
                        '#a855f7', '#7e22ce', '#f59e0b', '#d97706',
                        '#38bdf8', '#0284c7', '#22c55e', '#16a34a',
                        '#a855f7', '#c084fc', '#f59e0b', '#d97706',
                        '#38bdf8', '#0284c7', '#22c55e', '#16a34a',
                        '#a855f7', '#22c55e'
                    ],
                    borderColor: '#0b0f19',
                    borderWidth: 2,
                    borderDash: [4, 4] // Lamelles pointillées séparant le 15 et le 28
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'right',
                        labels: { color: '#f3f4f6', font: { size: 10 } }
                    }
                }
            }
        });
    </script>
</body>
</html>
